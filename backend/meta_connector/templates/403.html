<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>No access · Meta Connector</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:Inter,system-ui,sans-serif}</style></head>
<body class="min-h-screen flex items-center justify-center px-4 bg-gray-50 text-gray-900">
<main class="max-w-md text-center flex flex-col gap-3">
    <h1 class="text-[22px] font-semibold">You don't have access to this</h1>
    <p class="text-gray-600 text-[14px]">{{ exception|default:"Your role doesn't allow this page or action." }} Ask an admin if you need it.</p>
    <div class="flex justify-center gap-2 pt-2">
        <a href="/dashboard/" class="h-9 px-4 rounded-lg bg-indigo-600 text-white text-[14px] font-semibold flex items-center">Back to dashboard</a>
        <form method="post" action="/dashboard/logout/">{% csrf_token %}<button class="h-9 px-4 rounded-lg border text-[14px] font-semibold">Sign in as someone else</button></form>
    </div>
</main></body></html>
