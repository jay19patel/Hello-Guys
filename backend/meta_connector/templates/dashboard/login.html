<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Meta Connector</title>
    <script>try { const p = JSON.parse(localStorage.getItem('mc-display') || '{}'); document.documentElement.classList.toggle('dark', p.theme === 'dark' || (p.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)); } catch (e) {}</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: 247 247 248; --surface: 255 255 255; --line: 229 231 235; --ink: 17 24 39; --muted: 95 103 117; --accent: 79 70 229; --on-accent: 255 255 255; --bad: 200 30 30; }
        :root.dark { --bg: 12 13 16; --surface: 22 23 27; --line: 44 46 54; --ink: 236 237 240; --muted: 160 166 178; --accent: 140 150 250; --on-accent: 15 15 30; --bad: 248 113 113; color-scheme: dark; }
        body { font-family: 'Inter', system-ui, sans-serif; background: rgb(var(--bg)); color: rgb(var(--ink)); }
        .card { background: rgb(var(--surface)); border: 1px solid rgb(var(--line)); }
        .muted { color: rgb(var(--muted)); }
        input { width: 100%; height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid rgb(var(--line)); background: rgb(var(--surface)); color: rgb(var(--ink)); font-size: 14px; }
        input:focus { outline: none; border-color: rgb(var(--accent)); box-shadow: 0 0 0 3px rgb(var(--accent) / .18); }
        @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
        .rise { animation: rise .4s cubic-bezier(.2,.7,.2,1) both; }
        @media (prefers-reduced-motion: reduce) { .rise { animation: none; } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
    <main class="w-full max-w-sm flex flex-col gap-6 rise">
        <div class="flex flex-col items-center gap-3 text-center">
            <span class="w-12 h-12 rounded-xl flex items-center justify-center text-white text-xl" style="background: rgb(var(--accent))"><i class="fa-brands fa-meta"></i></span>
            <h1 class="text-[22px] font-semibold">Sign in to Meta Connector</h1>
            <p class="muted text-[14px]">WhatsApp &amp; Instagram inbox for your team</p>
        </div>
        <form method="post" class="card rounded-xl p-6 flex flex-col gap-4">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            {% if form.errors %}
            <p class="text-[14px]" style="color: rgb(var(--bad))" role="alert"><i class="fa-solid fa-circle-exclamation"></i> Wrong username or password.</p>
            {% endif %}
            <label class="flex flex-col gap-1.5 text-[13px] font-semibold">Username
                <input type="text" name="username" autocomplete="username" autofocus required value="{{ form.username.value|default:'' }}">
            </label>
            <label class="flex flex-col gap-1.5 text-[13px] font-semibold">Password
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <button class="h-10 rounded-lg font-semibold text-[14px] hover:opacity-90 transition-opacity" style="background: rgb(var(--accent)); color: rgb(var(--on-accent))">Sign in</button>
        </form>
        <p class="muted text-[13px] text-center">No account? Ask your admin to add you under Settings → Team.</p>
    </main>
</body>
</html>
