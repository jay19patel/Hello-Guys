{% extends "cms/base.html" %}

{% block head %}
<title>Confirm Delete · Hello Guys</title>
{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-surface border border-bad/30 rounded-xl p-6 shadow-sm">
    <div class="w-12 h-12 rounded-full bg-bad/10 text-bad flex items-center justify-center text-xl mx-auto mb-4">
        <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <h1 class="text-lg font-bold text-ink text-center">Are you sure?</h1>
    <p class="text-xs text-muted text-center mt-2">
        You are about to delete <strong class="text-ink">{{ object_name|default:object }}</strong>. This action cannot be undone.
    </p>

    <form method="post" class="mt-6 flex items-center justify-center gap-3">
        {% csrf_token %}
        <a href="{{ cancel_url|default:'javascript:history.back()' }}" class="btn btn-ghost text-xs">Cancel</a>
        <button type="submit" class="btn btn-primary bg-bad hover:bg-bad/90 text-white text-xs">
            <i class="fa-solid fa-trash-can mr-1"></i> Yes, Delete
        </button>
    </form>
</div>
{% endblock %}
