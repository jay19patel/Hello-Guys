{% extends "cms/base.html" %}

{% block head %}
<title>Skill · CMS Studio · Hello Guys</title>
{% endblock %}

{% block content %}
<div class="max-w-md mx-auto flex flex-col gap-6">
    <div>
        <div class="flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-accent">
            <a href="{% url 'cms_ui:overview' %}" class="hover:underline">CMS Studio</a>
            <span>/</span>
            <a href="{% url 'cms_ui:skill-list' %}" class="hover:underline">Skills</a>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-ink mt-1">Tech Skill / Tool</h1>
    </div>

    <div class="bg-surface border border-line rounded-xl p-6 shadow-sm">
        <form method="post" class="flex flex-col gap-4">
            {% csrf_token %}
            <div class="flex flex-col gap-1.5">
                <label for="{{ form.name.id_for_label }}" class="text-xs font-medium text-ink">Skill Name</label>
                {{ form.name }}
            </div>
            <div class="flex flex-col gap-1.5">
                <label for="{{ form.category.id_for_label }}" class="text-xs font-medium text-ink">Category</label>
                {{ form.category }}
            </div>
            <div class="flex flex-col gap-1.5">
                <label for="{{ form.icon_url.id_for_label }}" class="text-xs font-medium text-ink">Icon URL / SVG</label>
                {{ form.icon_url }}
            </div>
            <div class="flex flex-col gap-1.5">
                <label for="{{ form.proficiency_order.id_for_label }}" class="text-xs font-medium text-ink">Order</label>
                {{ form.proficiency_order }}
            </div>
            <div class="flex items-center gap-2 pt-2 border-t border-line">
                {{ form.is_active }}
                <label for="{{ form.is_active.id_for_label }}" class="text-xs font-medium text-ink cursor-pointer">Active</label>
            </div>
            <div class="flex items-center justify-end gap-3 pt-4 border-t border-line">
                <a href="{% url 'cms_ui:skill-list' %}" class="btn btn-ghost text-sm">Cancel</a>
                <button type="submit" class="btn btn-primary text-sm">Save Skill</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
