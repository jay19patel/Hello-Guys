{% extends "cms/base.html" %}

{% block head %}
<title>FAQ Item · CMS Studio · Hello Guys</title>
{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto flex flex-col gap-6">
    <div>
        <div class="flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-accent">
            <a href="{% url 'cms_ui:overview' %}" class="hover:underline">CMS Studio</a>
            <span>/</span>
            <a href="{% url 'cms_ui:faq-list' %}" class="hover:underline">FAQs</a>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-ink mt-1">FAQ Item</h1>
    </div>

    <div class="bg-surface border border-line rounded-xl p-6 shadow-sm">
        <form method="post" class="flex flex-col gap-4">
            {% csrf_token %}
            <div class="flex flex-col gap-1.5">
                <label for="{{ form.question.id_for_label }}" class="text-xs font-medium text-ink">Question</label>
                {{ form.question }}
            </div>
            <div class="flex flex-col gap-1.5">
                <label for="{{ form.answer.id_for_label }}" class="text-xs font-medium text-ink">Answer</label>
                {{ form.answer }}
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="flex flex-col gap-1.5">
                    <label for="{{ form.category.id_for_label }}" class="text-xs font-medium text-ink">Category</label>
                    {{ form.category }}
                </div>
                <div class="flex flex-col gap-1.5">
                    <label for="{{ form.order.id_for_label }}" class="text-xs font-medium text-ink">Order</label>
                    {{ form.order }}
                </div>
            </div>
            <div class="flex items-center gap-2 pt-2 border-t border-line">
                {{ form.is_active }}
                <label for="{{ form.is_active.id_for_label }}" class="text-xs font-medium text-ink cursor-pointer">Visible</label>
            </div>
            <div class="flex items-center justify-end gap-3 pt-4 border-t border-line">
                <a href="{% url 'cms_ui:faq-list' %}" class="btn btn-ghost text-sm">Cancel</a>
                <button type="submit" class="btn btn-primary text-sm">Save FAQ</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
