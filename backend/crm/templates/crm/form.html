{% extends "crm/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<header class="flex items-center gap-3">
    <a href="{{ back }}" class="btn btn-ghost btn-sm" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></a>
    <h1 class="text-2xl font-semibold">{{ title }}</h1>
</header>
<form method="post" class="card p-6 flex flex-col gap-5" {% if form.is_multipart %}enctype="multipart/form-data"{% endif %}>
    {% csrf_token %}
    {% for k, v in hidden.items %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endfor %}
    <div class="grid sm:grid-cols-2 gap-4">{% include "dashboard/_fields.html" %}</div>
    <div class="flex gap-2"><button class="btn btn-primary">Save</button><a href="{{ back }}" class="btn btn-ghost">Cancel</a></div>
</form>
{% endblock %}
