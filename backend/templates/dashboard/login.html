<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Hello Guys</title>
    {% include "components/_theme_head.html" %}
</head>
<body class="bg-bg text-ink min-h-screen flex items-center justify-center px-4 antialiased">
    <main class="w-full max-w-sm flex flex-col gap-6">
        <div class="flex flex-col items-center gap-3 text-center">
            <span class="w-12 h-12 rounded-2xl bg-accent text-on-accent flex items-center justify-center text-xl shadow-card">
                <i class="fa-brands fa-meta"></i>
            </span>
            <div class="flex flex-col gap-1">
                <h1 class="font-display text-[22px] font-bold text-ink">Sign in to Hello Guys</h1>
                <p class="text-muted text-[14px]">WhatsApp &amp; Instagram inbox for your team</p>
            </div>
        </div>

        <form method="post" class="card p-6 flex flex-col gap-4">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            {% if form.errors %}
            <div class="rounded-xl border border-bad/30 bg-bad/10 px-3.5 py-2.5 text-[13.5px] text-bad flex items-center gap-2" role="alert">
                <i class="fa-solid fa-circle-exclamation shrink-0"></i>
                <span>Wrong username or password.</span>
            </div>
            {% endif %}
            <div class="field flex flex-col gap-1.5">
                <label for="id_username" class="text-[13px] font-semibold text-ink">Username</label>
                <input type="text" id="id_username" name="username" autocomplete="username" autofocus required value="{{ form.username.value|default:'' }}">
            </div>
            <div class="field flex flex-col gap-1.5">
                <label for="id_password" class="text-[13px] font-semibold text-ink">Password</label>
                <input type="password" id="id_password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-full mt-1">Sign in</button>
        </form>

        <p class="text-muted text-[13px] text-center">No account? Ask your admin to add you under Settings → Team.</p>
    </main>
</body>
</html>
