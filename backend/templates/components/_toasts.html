{% if messages %}
<div class="fixed top-4 right-4 z-[60] flex flex-col gap-2.5 w-full max-w-sm px-4 sm:px-0 pointer-events-none" aria-live="polite">
    {% for message in messages %}
    <div x-data="{ show: true }"
         x-init="setTimeout(() => show = false, 5000)"
         x-show="show"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 translate-y-2 scale-95"
         x-transition:enter-end="opacity-100 translate-y-0 scale-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 translate-y-0 scale-100"
         x-transition:leave-end="opacity-0 translate-y-1 scale-95"
         class="pointer-events-auto flex items-start gap-3 rounded-xl bg-surface border border-line shadow-card px-4 py-3 text-[13.5px]"
         role="status">
        <span class="mt-0.5 shrink-0 w-5 h-5 rounded-full flex items-center justify-center
            {% if message.tags == 'success' %}bg-ok/15 text-ok{% elif message.tags == 'error' %}bg-bad/15 text-bad{% else %}bg-warn/15 text-warn{% endif %}">
            <i class="fa-solid text-[11px] {% if message.tags == 'success' %}fa-check{% elif message.tags == 'error' %}fa-xmark{% else %}fa-exclamation{% endif %}"></i>
        </span>
        <span class="flex-1 text-ink leading-snug">{{ message }}</span>
        <button type="button" @click="show = false" class="text-muted hover:text-ink p-0.5 rounded transition-colors" aria-label="Dismiss">
            <i class="fa-solid fa-xmark text-xs"></i>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
