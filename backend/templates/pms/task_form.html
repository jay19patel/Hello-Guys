{% extends "pms/base.html" %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<header class="flex items-center gap-3">
    <a href="{{ back }}" class="btn btn-ghost btn-sm" aria-label="Back to project"><i class="fa-solid fa-arrow-left"></i></a>
    <div>
        <h1 class="font-display text-[24px] leading-[30px] font-bold tracking-tight">{{ title }}</h1>
        <p class="text-[13px] text-muted">{{ project.name }}</p>
    </div>
</header>

<form method="post" class="card p-6 flex flex-col gap-5 max-w-3xl">
    {% csrf_token %}
    <div class="grid sm:grid-cols-2 gap-4">
        {% include "components/_fields.html" %}
    </div>
    <div class="flex flex-wrap items-center gap-2.5 pt-2 border-t border-line">
        <button type="submit" class="btn btn-primary">Save</button>
        <button type="submit" name="add_another" value="1" class="btn btn-ghost">Save &amp; add another</button>
        <a href="{{ back }}" class="btn btn-ghost">Cancel</a>
    </div>
</form>
{% endblock %}
