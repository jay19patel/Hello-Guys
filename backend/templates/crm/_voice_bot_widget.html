{# Reusable Pipecat AI Voice Bot Launcher + Live Status & Transcript Panel #}
<section class="card p-5 flex flex-col gap-4"
         x-data="voiceBotWidget({
             csrf: '{{ csrf_token }}',
             customerId: '{{ customer.pk|default:'' }}',
             opportunityId: '{{ opportunity.pk|default:'' }}',
             meetingId: '{{ meeting.pk|default:'' }}',
             defaultMeetUrl: '{{ meeting.meet_url|default:'' }}',
             defaultPrompt: '{{ default_voice_prompt|default:''|escapejs }}',
             initialSessionId: '{{ active_voice_session.id|default:'' }}',
             initialStatus: '{{ active_voice_session.status|default:'' }}',
             initialStatusLabel: '{{ active_voice_session.get_status_display|default:''|escapejs }}'
         })"
         x-init="if (sessionId) { pollStatus(); if (status === 'queued' || status === 'in_meeting') startPolling(); }">
    <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5">
            <span class="w-8 h-8 rounded-xl bg-accent/10 text-accent flex items-center justify-center shrink-0">
                <i class="fa-solid fa-microphone-lines"></i>
            </span>
            <div>
                <h2 class="font-display font-semibold text-[15px] text-ink">AI Voice Bot (Pipecat)</h2>
                <p class="text-[12px] text-muted">Join Google Meet or Phone call with live CRM context.</p>
            </div>
        </div>
        <template x-if="status">
            <span class="pill"
                  :class="{
                      'bg-warn/15 text-warn': status === 'queued',
                      'bg-ok/15 text-ok': status === 'in_meeting',
                      'bg-subtle text-muted border border-line': status === 'completed',
                      'bg-bad/15 text-bad': status === 'failed'
                  }"
                  x-text="statusLabel"></span>
        </template>
    </div>

    <div class="grid sm:grid-cols-2 gap-3">
        {% if not customer %}
        <div class="field flex flex-col gap-1 sm:col-span-2">
            <label class="caps">Lead / Customer (optional)</label>
            <select x-model="customerId">
                <option value="">No specific customer</option>
                {% for c in customers %}<option value="{{ c.pk }}">{{ c.name }}{% if c.company %} ({{ c.company }}){% endif %}</option>{% endfor %}
            </select>
        </div>
        {% endif %}

        <div class="field flex flex-col gap-1 sm:col-span-2">
            <label class="caps">Mode</label>
            <select x-model="mode">
                <option value="google_meet">Google Meet</option>
                <option value="phone_call">Phone / WebSocket Call</option>
            </select>
        </div>

        <div class="field flex flex-col gap-1 sm:col-span-2" x-show="mode === 'google_meet'">
            <label class="caps">Google Meet Code or Link</label>
            <input type="text" x-model="meetInput" @blur="formatMeet()" placeholder="abc-defg-hij or https://meet.google.com/abc-defg-hij">
        </div>

        <div class="field flex flex-col gap-1 sm:col-span-2" x-show="mode === 'phone_call'" x-cloak>
            <label class="caps">Phone Number</label>
            <input type="text" x-model="phoneNumber" placeholder="+9198XXXXXXXX">
        </div>

        <div class="field flex flex-col gap-1 sm:col-span-2">
            <label class="caps">Bot Name</label>
            <input type="text" x-model="botName" placeholder="Hello Guys AI Assistant">
        </div>

        <div class="field flex flex-col gap-1 sm:col-span-2">
            <label class="caps">Custom Prompt (CRM context auto-injected)</label>
            <textarea rows="2" x-model="customPrompt" placeholder="e.g. Confirm their requirements, share pricing range, and book a follow-up..."></textarea>
        </div>
    </div>

    <p x-show="errorMsg" x-text="errorMsg" x-cloak class="text-[12.5px] text-bad flex items-center gap-1.5"></p>

    <div class="flex flex-wrap items-center gap-2">
        <button type="button" @click="startBot()" :disabled="loading || (status === 'queued' || status === 'in_meeting')" class="btn btn-primary btn-sm disabled:opacity-50">
            <i class="fa-solid" :class="loading ? 'fa-spinner fa-spin' : 'fa-play'"></i>
            <span x-text="loading ? 'Starting…' : 'Start Bot'"></span>
        </button>
        <button type="button" @click="stopBot()" x-show="sessionId && (status === 'queued' || status === 'in_meeting')" x-cloak :disabled="stopping" class="btn btn-ghost btn-sm text-bad hover:bg-bad/10">
            <i class="fa-solid" :class="stopping ? 'fa-spinner fa-spin' : 'fa-stop'"></i>
            <span>Stop / Leave Meeting</span>
        </button>
    </div>

    <!-- Live Status & Transcript Panel -->
    <div x-show="sessionId" x-cloak class="rounded-xl border border-line bg-subtle/40 p-3.5 flex flex-col gap-3 text-[12.5px]">
        <div class="flex items-center justify-between gap-2">
            <span class="caps">Live Session</span>
            <span class="font-mono text-[11px] text-muted" x-text="sessionId"></span>
        </div>

        <template x-if="logs.length">
            <div class="flex flex-col gap-1">
                <span class="font-semibold text-ink">Connection Logs</span>
                <ul class="text-muted space-y-0.5 max-h-24 overflow-y-auto font-mono text-[11px]">
                    <template x-for="(log, idx) in logs" :key="idx">
                        <li x-text="'• ' + log"></li>
                    </template>
                </ul>
            </div>
        </template>

        <template x-if="transcript.length">
            <div class="flex flex-col gap-1.5 pt-2 border-t border-line">
                <span class="font-semibold text-ink">Transcript</span>
                <div class="space-y-1.5 max-h-40 overflow-y-auto">
                    <template x-for="(turn, idx) in transcript" :key="idx">
                        <p class="text-ink"><b class="capitalize" x-text="turn.role + ': '"></b><span x-text="turn.text"></span></p>
                    </template>
                </div>
            </div>
        </template>

        <template x-if="summary">
            <div class="flex flex-col gap-1 pt-2 border-t border-line">
                <span class="font-semibold text-ok">Post-Call Summary (logged to CRM Activity)</span>
                <p class="text-ink whitespace-pre-line" x-text="summary"></p>
            </div>
        </template>
    </div>
</section>

<script>
function voiceBotWidget(cfg) {
    return {
        csrf: cfg.csrf,
        customerId: cfg.customerId,
        opportunityId: cfg.opportunityId,
        meetingId: cfg.meetingId,
        mode: 'google_meet',
        provider: 'self_hosted',
        meetInput: cfg.defaultMeetUrl || '',
        phoneNumber: '',
        botName: 'Hello Guys AI Assistant',
        customPrompt: cfg.defaultPrompt || '',
        sessionId: cfg.initialSessionId || '',
        status: cfg.initialStatus || '',
        statusLabel: cfg.initialStatusLabel || '',
        logs: [],
        transcript: [],
        summary: '',
        errorMsg: '',
        loading: false,
        stopping: false,
        timer: null,

        formatMeet() {
            const v = (this.meetInput || '').trim();
            if (/^[a-z]{3}-[a-z]{4}-[a-z]{3}$/i.test(v)) {
                this.meetInput = 'https://meet.google.com/' + v.toLowerCase();
            }
        },

        async startBot() {
            this.formatMeet();
            this.errorMsg = '';
            this.loading = true;
            try {
                const res = await fetch('/api/voice-bot/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': this.csrf },
                    body: JSON.stringify({
                        lead_id: this.customerId || null,
                        opportunity_id: this.opportunityId || null,
                        meeting_id: this.meetingId || null,
                        meet_code_or_url: this.meetInput,
                        phone_number: this.phoneNumber,
                        bot_name: this.botName,
                        custom_prompt: this.customPrompt,
                        mode: this.mode,
                        provider: this.provider,
                    }),
                });
                const data = await res.json();
                if (!res.ok || !data.ok) {
                    this.errorMsg = data.error || 'Could not start AI Voice Bot.';
                    return;
                }
                this.sessionId = data.session_id;
                this.status = data.status;
                this.statusLabel = data.status_label;
                this.logs = data.connection_logs || [];
                this.summary = '';
                this.transcript = [];
                this.startPolling();
            } catch (e) {
                this.errorMsg = 'Network error starting voice bot.';
            } finally {
                this.loading = false;
            }
        },

        async stopBot() {
            if (!this.sessionId) return;
            this.stopping = true;
            try {
                const res = await fetch('/api/voice-bot/stop', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': this.csrf },
                    body: JSON.stringify({ session_id: this.sessionId }),
                });
                const data = await res.json();
                if (res.ok && data.ok) {
                    this.status = data.status;
                    this.statusLabel = data.status_label;
                    this.summary = data.call_summary || '';
                    this.logs = data.connection_logs || this.logs;
                    this.stopPolling();
                }
            } finally {
                this.stopping = false;
            }
        },

        startPolling() {
            this.stopPolling();
            this.timer = setInterval(() => this.pollStatus(), 3000);
        },

        stopPolling() {
            if (this.timer) { clearInterval(this.timer); this.timer = null; }
        },

        async pollStatus() {
            if (!this.sessionId) return;
            try {
                const res = await fetch('/api/voice-bot/status/' + this.sessionId, { cache: 'no-store' });
                if (!res.ok) return;
                const data = await res.json();
                this.status = data.status;
                this.statusLabel = data.status_label;
                this.logs = data.connection_logs || [];
                this.transcript = data.transcript || [];
                this.summary = data.call_summary || '';
                if (data.error_message) this.errorMsg = data.error_message;
                if (data.status === 'completed' || data.status === 'failed') {
                    this.stopPolling();
                }
            } catch (e) {}
        }
    };
}
</script>
