<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Instagram Automation</title>
  <style>
    :root {
      --ig-1: #833ab4;
      --ig-2: #e1306c;
      --ig-3: #fd8d32;
      --bg: #f0f2f5;
      --panel: #ffffff;
      --border: #e6e8eb;
      --text: #1c1e21;
      --muted: #65676b;
      --faint: #8a8d91;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 28px 16px 60px;
    }
    .wrap { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

    /* ---- header ---- */
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 22px;
      box-shadow: var(--shadow);
    }
    .logo {
      width: 42px; height: 42px; flex: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--ig-1), var(--ig-2) 55%, var(--ig-3));
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 1.05rem;
    }
    .header-text { flex: 1; min-width: 0; }
    .header-title { display: flex; align-items: center; gap: 8px; }
    h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; }
    .live-pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.7rem; font-weight: 700; color: #1a8a4a;
      background: #e6f6ec; border-radius: 20px; padding: 3px 10px 3px 8px;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .live-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #1fb45a;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; box-shadow: 0 0 0 0 rgba(31,180,90,.5); } 50% { opacity: .55; box-shadow: 0 0 0 4px rgba(31,180,90,0); } }
    .header-sub { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }

    /* ---- generic panel ---- */
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 22px;
    }
    .panel-title {
      font-size: 0.72rem; font-weight: 700; color: var(--faint);
      text-transform: uppercase; letter-spacing: .06em;
      margin-bottom: 12px;
    }

    /* ---- setup grid (urls) ---- */
    .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 640px) { .setup-grid { grid-template-columns: 1fr; } }
    .field-label { font-size: 0.78rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .url-row {
      display: flex; align-items: stretch; gap: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px 4px 4px 12px;
    }
    .url-row input {
      flex: 1; min-width: 0;
      border: none; background: transparent;
      font-family: 'SF Mono', ui-monospace, Consolas, monospace;
      font-size: 0.8rem; color: var(--text);
      outline: none;
    }
    .btn {
      border: none; cursor: pointer;
      font-size: 0.76rem; font-weight: 700;
      padding: 8px 14px; border-radius: 8px;
      white-space: nowrap;
      transition: transform .08s ease, opacity .15s ease;
      text-decoration: none; display: inline-flex; align-items: center;
    }
    .btn:active { transform: scale(0.96); }
    .btn-solid {
      background: linear-gradient(135deg, var(--ig-1), var(--ig-2));
      color: #fff;
    }
    .btn-solid:hover { opacity: 0.92; }
    .btn-ghost { background: #eceef1; color: var(--text); }
    .btn-ghost:hover { background: #e2e4e8; }
    .btn-group { display: flex; gap: 6px; }

    /* ---- stat ---- */
    .stat-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .stat-value {
      font-size: 2.6rem; font-weight: 800; letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--ig-1), var(--ig-2) 60%, var(--ig-3));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .stat-caption { font-size: 0.82rem; color: var(--muted); }

    /* ---- logs panel ---- */
    .logs-panel { padding: 18px 22px 20px; }
    .logs-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
    .logs-head-left { display: flex; align-items: baseline; gap: 8px; }
    .logs-count { font-size: 0.78rem; font-weight: 700; color: var(--ig-2); }
    .refresh-note { font-size: 0.76rem; color: var(--faint); }
    .refresh-note b { color: var(--muted); font-weight: 700; }

    #log-list {
      background: #0f1115;
      border-radius: 10px;
      padding: 10px 6px 10px 14px;
      max-height: 420px;
      overflow-y: auto;
    }
    #log-list::-webkit-scrollbar { width: 8px; }
    #log-list::-webkit-scrollbar-thumb { background: #2a2e37; border-radius: 8px; }
    #log-list::-webkit-scrollbar-track { background: transparent; }

    .log-item {
      font-family: 'SF Mono', ui-monospace, Consolas, monospace;
      font-size: 0.76rem; line-height: 1.55;
      color: #c7ccd4;
      padding: 5px 8px;
      white-space: pre-wrap; word-break: break-word;
      border-radius: 6px;
      border-left: 2px solid transparent;
    }
    .log-item:hover { background: rgba(255,255,255,0.04); }
    .log-item .time { color: #5b6270; margin-right: 10px; }
    .log-item.level-INFO { border-left-color: #3a4150; }
    .log-item.level-WARNING { color: #f5c451; border-left-color: #f5c451; }
    .log-item.level-ERROR { color: #ff6b6b; border-left-color: #ff6b6b; }

    .empty { color: var(--faint); font-size: 0.82rem; padding: 8px; }

    #load-more-btn {
      display: none;
      margin-top: 10px; width: 100%;
      border: 1px dashed var(--border);
      background: transparent; color: var(--muted);
      font-size: 0.78rem; font-weight: 600;
      padding: 9px; border-radius: 8px;
      cursor: pointer;
    }
    #load-more-btn:hover { background: var(--bg); border-color: #ccc; }

    footer { text-align: center; font-size: 0.74rem; color: var(--faint); padding-top: 4px; }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="header">
      <div class="logo">IG</div>
      <div class="header-text">
        <div class="header-title">
          <h1>Instagram Automation</h1>
          <span class="live-pill"><span class="live-dot"></span>Live</span>
        </div>
        <div class="header-sub">Webhook monitor &middot; auto-refreshes every 10s</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Setup</div>
      <div class="setup-grid">
        <div>
          <div class="field-label">Webhook URL</div>
          <div class="url-row">
            <input type="text" id="webhook-url" readonly value="Loading…" />
            <button class="btn btn-solid" id="copy-btn" onclick="copyToClipboard('webhook-url','copy-btn')">Copy</button>
          </div>
        </div>
        <div>
          <div class="field-label">Privacy Policy URL</div>
          <div class="url-row">
            <input type="text" id="privacy-url" readonly value="Loading…" />
            <div class="btn-group">
              <button class="btn btn-ghost" id="privacy-copy-btn" onclick="copyToClipboard('privacy-url','privacy-copy-btn')">Copy</button>
              <a class="btn btn-solid" href="/privacy-policy" target="_blank">Open</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Total Webhooks Received</div>
      <div class="stat-row">
        <div class="stat-value" id="count">—</div>
        <div class="stat-caption">since server start</div>
      </div>
    </div>

    <div class="panel logs-panel">
      <div class="logs-head">
        <div class="logs-head-left">
          <div class="panel-title" style="margin-bottom:0;">Server Logs</div>
          <span class="logs-count" id="log-count"></span>
        </div>
        <div class="refresh-note">Next refresh in <b id="countdown">10</b>s</div>
      </div>
      <div id="log-list"><p class="empty">Loading…</p></div>
      <button id="load-more-btn" onclick="loadOlderLogs()">Load older logs</button>
    </div>

    <footer>Instagram + WhatsApp Webhook Monitor</footer>
  </div>

  <script>
    let secondsLeft = 10;
    const logsById = new Map();
    let hasMoreOlder = true;

    document.getElementById('webhook-url').value = window.location.origin + '/webhook';
    document.getElementById('privacy-url').value = window.location.origin + '/privacy-policy';

    function copyToClipboard(inputId, btnId) {
      const input = document.getElementById(inputId);
      navigator.clipboard.writeText(input.value).then(() => {
        const btn = document.getElementById(btnId);
        const original = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = original; }, 1500);
      });
    }

    function renderLogs() {
      const sorted = Array.from(logsById.values()).sort((a, b) => (a.id < b.id ? 1 : -1));

      document.getElementById('log-count').textContent = sorted.length ? `${sorted.length} entries` : '';

      const logList = document.getElementById('log-list');
      logList.innerHTML = sorted.length
        ? sorted.map(l => `
            <div class="log-item level-${l.level}">
              <span class="time">${l.time}</span>${l.message}
            </div>
          `).join('')
        : '<p class="empty">No logs yet.</p>';

      document.getElementById('load-more-btn').style.display = hasMoreOlder ? 'block' : 'none';
    }

    // Polled every 10s — only ever fetches the newest page, so a live tail
    // never re-fetches (or re-renders) logs already paged in below it.
    async function refresh() {
      try {
        const statsRes = await fetch('/stats');
        const stats = await statsRes.json();
        document.getElementById('count').textContent = stats.webhook_count;
      } catch(e) {
        console.error(e);
      }

      try {
        const logRes = await fetch('/logs?limit=20');
        const logData = await logRes.json();
        logData.logs.forEach(l => logsById.set(l.id, l));
        renderLogs();
      } catch(e) {
        console.error(e);
      }

      secondsLeft = 10;
    }

    // Manual "Load older logs" — cursor pagination via before_id, so this
    // never does an expensive skip() over the collection.
    async function loadOlderLogs() {
      const oldest = Array.from(logsById.values()).sort((a, b) => (a.id < b.id ? 1 : -1)).pop();
      if (!oldest) return;

      try {
        const res = await fetch(`/logs?before_id=${oldest.id}&limit=20`);
        const data = await res.json();
        data.logs.forEach(l => logsById.set(l.id, l));
        hasMoreOlder = data.has_more;
        renderLogs();
      } catch(e) {
        console.error(e);
      }
    }

    // countdown tick every second
    setInterval(() => {
      secondsLeft = Math.max(0, secondsLeft - 1);
      document.getElementById('countdown').textContent = secondsLeft;
    }, 1000);

    refresh();
    setInterval(refresh, 10000);
  </script>
</body>
</html>
