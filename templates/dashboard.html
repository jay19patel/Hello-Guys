<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Instagram Automation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #222;
      padding: 40px 20px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 28px 32px;
      max-width: 640px;
      margin: 0 auto 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
    .badge {
      display: inline-block;
      background: #fce4ec;
      color: #c2185b;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    .meta { font-size: 0.85rem; color: #666; }
    .stat { font-size: 2.4rem; font-weight: 700; color: #E1306C; margin: 8px 0 4px; }
    .label { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: .05em; }
    #event-list { margin-top: 16px; }
    .event-item {
      border-left: 3px solid #E1306C;
      padding: 8px 12px;
      margin-bottom: 10px;
      background: #f9f9f9;
      border-radius: 0 6px 6px 0;
      font-size: 0.85rem;
    }
    .event-item .time { font-size: 0.75rem; color: #aaa; float: right; }
    .event-item pre {
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 4px;
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 0.78rem;
    }
    .empty { color: #aaa; font-size: 0.85rem; }
    .url-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      background: #f5f5f5;
      border-radius: 8px;
      padding: 10px 12px;
    }
    .url-row input {
      flex: 1;
      border: none;
      background: transparent;
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 0.85rem;
      color: #222;
      outline: none;
    }
    .copy-btn {
      border: none;
      background: #E1306C;
      color: #fff;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .copy-btn:active { transform: scale(0.97); }
    #log-list {
      margin-top: 16px;
      max-height: 320px;
      overflow-y: auto;
      background: #10151a;
      border-radius: 8px;
      padding: 12px;
    }
    .log-item {
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 0.78rem;
      color: #cfd8dc;
      padding: 3px 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .log-item .time { color: #6c7a89; margin-right: 8px; }
    .log-item.level-WARNING { color: #ffca28; }
    .log-item.level-ERROR { color: #ef5350; }
    #refresh-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #E1306C;
      margin-left: 6px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; } 50% { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Instagram Automation <span id="refresh-dot"></span></h1>
    <span class="badge">v1.0.0</span>
    <p class="meta">Live dashboard &mdash; auto-refreshes every 10 seconds.</p>
  </div>

  <div class="card">
    <div class="label">Webhook URL</div>
    <div class="url-row">
      <input type="text" id="webhook-url" readonly value="Loading…" />
      <button class="copy-btn" id="copy-btn" onclick="copyWebhookUrl()">Copy</button>
    </div>
  </div>

  <div class="card">
    <div class="label">Privacy Policy URL</div>
    <div class="url-row">
      <input type="text" id="privacy-url" readonly value="Loading…" />
      <button class="copy-btn" id="privacy-copy-btn" onclick="copyPrivacyUrl()">Copy</button>
      <a class="copy-btn" id="privacy-open-btn" href="/privacy-policy" target="_blank" style="text-decoration:none; display:inline-block;">Open</a>
    </div>
  </div>

  <div class="card">
    <div class="label">Total Webhooks Received</div>
    <div class="stat" id="count">—</div>
    <div class="label">since server start</div>
  </div>

  <div class="card">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
      <div class="label">Recent Events <span id="event-count" style="color:#E1306C;font-weight:700;"></span></div>
      <div style="font-size:0.78rem; color:#aaa;">Next refresh in <span id="countdown" style="color:#E1306C;font-weight:600;">10</span>s</div>
    </div>
    <div id="event-list"><p class="empty">Loading…</p></div>
  </div>

  <div class="card">
    <div class="label">Server Logs <span id="log-count" style="color:#E1306C;font-weight:700;"></span></div>
    <div id="log-list"><p class="empty">Loading…</p></div>
  </div>

  <script>
    let secondsLeft = 10;

    document.getElementById('webhook-url').value = window.location.origin + '/webhook';
    document.getElementById('privacy-url').value = window.location.origin + '/privacy-policy';

    function copyWebhookUrl() {
      const input = document.getElementById('webhook-url');
      navigator.clipboard.writeText(input.value).then(() => {
        const btn = document.getElementById('copy-btn');
        const original = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = original; }, 1500);
      });
    }

    function copyPrivacyUrl() {
      const input = document.getElementById('privacy-url');
      navigator.clipboard.writeText(input.value).then(() => {
        const btn = document.getElementById('privacy-copy-btn');
        const original = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = original; }, 1500);
      });
    }

    async function refresh() {
      try {
        const res = await fetch('/events');
        const data = await res.json();
        document.getElementById('count').textContent = data.webhook_count;

        const eventCount = data.events.length;
        document.getElementById('event-count').textContent = eventCount ? `(${eventCount})` : '';

        const list = document.getElementById('event-list');
        if (!eventCount) {
          list.innerHTML = '<p class="empty">No events yet.</p>';
        } else {
          list.innerHTML = data.events.map(e => `
            <div class="event-item">
              <span class="time">${e.received_at}</span>
              <pre>${JSON.stringify(e.raw, null, 2)}</pre>
            </div>
          `).join('');
        }
      } catch(e) {
        console.error(e);
      }

      try {
        const logRes = await fetch('/logs');
        const logData = await logRes.json();

        const logCount = logData.logs.length;
        document.getElementById('log-count').textContent = logCount ? `(${logCount})` : '';

        const logList = document.getElementById('log-list');
        if (!logCount) {
          logList.innerHTML = '<p class="empty">No logs yet.</p>';
        } else {
          logList.innerHTML = logData.logs.map(l => `
            <div class="log-item level-${l.level}">
              <span class="time">${l.time}</span>${l.message}
            </div>
          `).join('');
        }
      } catch(e) {
        console.error(e);
      }

      secondsLeft = 10;
    }

    // countdown tick every second
    setInterval(() => {
      secondsLeft = Math.max(0, secondsLeft - 1);
      document.getElementById('countdown').textContent = secondsLeft;
    }, 1000);

    refresh();
    setInterval(refresh, 10000);
  </script>
</body>
</html>
