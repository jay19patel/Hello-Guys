[project]
name = "hello-guys"
version = "0.1.0"
description = "Hello Guys — AI-powered Django platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core Django stack
    "django>=5.1.0,<5.2.0",
    "djangorestframework>=3.15.2",
    "django-environ>=0.11.2",
    "django-cors-headers>=4.6.0",
    "django-ninja>=1.3.0",
    # HTTP & Security
    "requests>=2.32.3",
    "cryptography>=43.0.0",
    # AI / LLM
    "litellm>=1.50.0",
    "tenacity>=8.2", # litellm needs it for num_retries
    "pydantic>=2.10.0",
    # RAG (vector store + PDF)
    "pymilvus>=2.4.0",
    "pypdf>=5.0.0",
    # Task queue (Dramatiq + Redis)
    "dramatiq[redis,watch]>=1.17.0",
    "redis>=5.2.0",
    # Scheduling (triggers)
    "croniter>=5.0.0",
    "google-api-python-client>=2.202.0",
    "google-auth>=2.63.1",
    "google-auth-oauthlib>=1.5.0",
    "httplib2>=0.32.1",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "groq>=1.7.0",
    "edge-tts>=7.3.1",
    "livekit-api>=1.2.3",
    "livekit-agents>=1.8.13",
    "livekit-plugins-openai>=1.8.13",
    "livekit-plugins-silero>=1.8.13",
]

[tool.uv]
# Tell uv the Django project root so manage.py imports work
package = false
